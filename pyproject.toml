[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pentava-business-finances"
version = "0.1.0"
description = "Backend API for Pentava Business Finances"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-dotenv>=1.0,<2.0",
    "google-auth>=2.35,<3.0",
    "google-auth-oauthlib>=1.2,<2.0",
    "google-api-python-client>=2.150,<3.0",
    "cryptography>=44,<51",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

